.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

<script>const INITIAL_WORDS = [{"id":"daily-001","category":"daily","word":"Good morning","ipa":"/ɡʊd ˈmɔːrnɪŋ/","zh":"早上好","example":"Good morning! Did you sleep well?","exampleZh":"早上好！昨晚睡得好吗？"},{"id":"daily-002","category":"daily","word":"How are you?","ipa":"/haʊ ɑːr juː/","zh":"你好吗？","example":"How are you doing today?","exampleZh":"你今天过得怎么样？"},{"id":"daily-003","category":"daily","word":"Nice to meet you","ipa":"/naɪs tə miːt juː/","zh":"很高兴认识你","example":"Nice to meet you, I'm Alex.","exampleZh":"很高兴认识你，我叫亚历克斯。"},{"id":"daily-004","category":"daily","word":"Could you help me?","ipa":"/kʊd juː hɛlp miː/","zh":"你能帮帮我吗？","example":"Could you help me carry this box?","exampleZh":"你能帮我搬这个箱子吗？"},{"id":"daily-005","category":"daily","word":"Thank you so much","ipa":"/θæŋk juː soʊ mʌtʃ/","zh":"非常感谢你","example":"Thank you so much for your support.","exampleZh":"非常感谢你的支持。"},{"id":"daily-006","category":"daily","word":"You're welcome","ipa":"/jʊr ˈwɛlkəm/","zh":"不客气","example":"You're welcome. I'm happy to help.","exampleZh":"不客气，我很乐意帮忙。"},{"id":"daily-007","category":"daily","word":"Excuse me","ipa":"/ɪkˈskjuːz miː/","zh":"打扰一下；劳驾","example":"Excuse me, is this seat taken?","exampleZh":"打扰一下，这个座位有人吗？"},{"id":"daily-008","category":"daily","word":"I'm sorry","ipa":"/aɪm ˈsɑːri/","zh":"对不起","example":"I'm sorry I missed your call.","exampleZh":"对不起，我没接到你的电话。"},{"id":"daily-009","category":"daily","word":"No problem","ipa":"/noʊ ˈprɑːbləm/","zh":"没问题","example":"No problem, I can send it today.","exampleZh":"没问题，我今天可以发给你。"},{"id":"daily-010","category":"daily","word":"See you later","ipa":"/siː juː ˈleɪtər/","zh":"回头见","example":"See you later at the office.","exampleZh":"办公室见。"},{"id":"daily-011","category":"daily","word":"What's your name?","ipa":"/wʌts jʊr neɪm/","zh":"你叫什么名字？","example":"What's your name, please?","exampleZh":"请问你叫什么名字？"},{"id":"daily-012","category":"daily","word":"Where are you from?","ipa":"/wɛr ɑːr juː frʌm/","zh":"你来自哪里？","example":"Where are you from originally?","exampleZh":"你原来是哪里人？"},{"id":"daily-013","category":"daily","word":"What do you do?","ipa":"/wʌt duː juː duː/","zh":"你做什么工作？","example":"What do you do at your company?","exampleZh":"你在公司负责什么工作？"},{"id":"daily-014","category":"daily","word":"I work as an engineer","ipa":"/aɪ wɜːrk æz ən ˌɛndʒɪˈnɪr/","zh":"我是一名工程师","example":"I work as an engineer in the vehicle industry.","exampleZh":"我在汽车行业担任工程师。"},{"id":"daily-015","category":"daily","word":"How much is it?","ipa":"/haʊ mʌtʃ ɪz ɪt/","zh":"多少钱？","example":"How much is it for two tickets?","exampleZh":"两张票多少钱？"},{"id":"daily-016","category":"daily","word":"I'd like a coffee","ipa":"/aɪd laɪk ə ˈkɔːfi/","zh":"我想要一杯咖啡","example":"I'd like a coffee without sugar.","exampleZh":"我想要一杯不加糖的咖啡。"},{"id":"daily-017","category":"daily","word":"Could I have the menu?","ipa":"/kʊd aɪ hæv ðə ˈmɛnjuː/","zh":"能给我菜单吗？","example":"Could I have the menu, please?","exampleZh":"请给我一份菜单好吗？"},{"id":"daily-018","category":"daily","word":"Do you have Wi-Fi?","ipa":"/duː juː hæv ˈwaɪ faɪ/","zh":"这里有无线网络吗？","example":"Do you have Wi-Fi in the meeting room?","exampleZh":"会议室有无线网络吗？"},{"id":"daily-019","category":"daily","word":"Where is the restroom?","ipa":"/wɛr ɪz ðə ˈrɛstruːm/","zh":"洗手间在哪里？","example":"Where is the restroom on this floor?","exampleZh":"这一层的洗手间在哪里？"},{"id":"daily-020","category":"daily","word":"I'm on my way","ipa":"/aɪm ɑːn maɪ weɪ/","zh":"我正在路上","example":"I'm on my way and will be there soon.","exampleZh":"我正在路上，很快就到。"},{"id":"daily-021","category":"daily","word":"Running late","ipa":"/ˈrʌnɪŋ leɪt/","zh":"要迟到了","example":"I'm running late because of traffic.","exampleZh":"因为堵车，我要迟到了。"},{"id":"daily-022","category":"daily","word":"Take your time","ipa":"/teɪk jʊr taɪm/","zh":"别着急；慢慢来","example":"Take your time with the report.","exampleZh":"报告可以慢慢做。"},{"id":"daily-023","category":"daily","word":"Sounds good","ipa":"/saʊndz ɡʊd/","zh":"听起来不错","example":"Friday afternoon sounds good to me.","exampleZh":" ":"/ɡoʊ streɪt/","zh":"直走","example":"Go straight for two blocks.","exampleZh":"直走两个街区。"},{"id":"daily-071","category":"daily","word":"How far is it?","ipa":"/haʊ fɑːr ɪz ɪt/","zh":"有多远？","example":"How far is it from here to the factory?","exampleZh":"从这里到工厂有多远？"},{"id":"daily-072","category":"daily","word":"Is it available?","ipa":"/ɪz ɪt əˈveɪləbəl/","zh":"有货吗；可以用吗？","example":"Is this spare part available today?","exampleZh":"这个备件今天有货吗？"},{"id":"daily-073","category":"daily","word":"Out of stock","ipa":"/aʊt əv stɑːk/","zh":"缺货","example":"The replacement cable is out of stock.","exampleZh":"替换电缆缺货了。"},{"id":"daily-074","category":"daily","word":"Could you send it?","ipa":"/kʊd juː sɛnd ɪt/","zh":"你能把它发过来吗？","example":"Could you send it as a PDF?","exampleZh":"你能把它以 PDF 形式发过来吗？"},{"id":"daily-075","category":"daily","word":"I'm looking for","ipa":"/aɪm ˈlʊkɪŋ fɔːr/","zh":"我正在找……","example":"I'm looking for the service manual.","exampleZh":"我正在找维修手册。"},{"id":"daily-076","category":"daily","word":"Let me introduce","ipa":"/lɛt miː ˌɪntrəˈduːs/","zh":"让我介绍一下","example":"Let me introduce our project team.","exampleZh":"让我介绍一下我们的项目团队。"},{"id":"daily-077","category":"daily","word":"Take notes","ipa":"/teɪk noʊts/","zh":"做笔记","example":"Please take notes during the training.","exampleZh":"培训期间请做好笔记。"},{"id":"daily-078","category":"daily","word":"Stay in touch","ipa":"/steɪ ɪn tʌtʃ/","zh":"保持联系","example":"Let's stay in touch after the exhibition.","exampleZh":"展会结束后保持联系。"},{"id":"daily-079","category":"daily","word":"Have a great day","ipa":"/hæv ə ɡreɪt deɪ/","zh":"祝你今天愉快","example":"Thanks for calling, and have a great day!","exampleZh":"感谢来电，祝你今天愉快！"},{"id":"daily-080","category":"daily","word":"Could you give me a hand?","ipa":"/kʊd juː ɡɪv miː ə hænd/","zh":"你能搭把手吗？","example":"Could you give me a hand with this case?","exampleZh":"你能帮我搬一下这个箱子吗？"},{"id":"ev-001","category":"ev","word":"Electric vehicle","ipa":"/ɪˈlɛktrɪk ˈviːɪkəl/","zh":"电动汽车","example":"This elec -023","category":"ev","word":"Inverter","ipa":"/ɪnˈvɜːrtər/","zh":"逆变器","example":"The inverter converts DC power to AC power.","exampleZh":"逆变器将直流电转换为交流电。"},{"id":"ev-024","category":"ev","word":"Traction motor","ipa":"/ˈtrækʃən ˈmoʊtər/","zh":"驱动电机","example":"The traction motor drives the wheels.","exampleZh":"驱动电机带动车轮转动。"},{"id":"ev-025","category":"ev","word":"Motor controller","ipa":"/ˈmoʊtər kənˈtroʊlər/","zh":"电机控制器","example":"The motor controller regulates torque.","exampleZh":"电机控制器调节扭矩。"},{"id":"ev-026","category":"ev","word":"Electric drive unit","ipa":"/ɪˈlɛktrɪk draɪv ˈjuːnɪt/","zh":"电驱动总成","example":"The electric drive unit combines a motor and gearbox.","exampleZh":"电驱动总成集成电机与减速箱。"},{"id":"ev-027","category":"ev","word":"Regenerative braking","ipa":"/rɪˈdʒɛnərətɪv ˈbreɪkɪŋ/","zh":"能量回收制动","example":"Regenerative braking charges the battery while slowing down.","exampleZh":"能量回收制动在减速时为电池充电。"},{"id":"ev-028","category":"ev","word":"Torque request","ipa":"/tɔːrk rɪˈkwɛst/","zh":"扭矩请求","example":"The controller sends a torque request to the motor.","exampleZh":"控制器向电机发送扭矩请求。"},{"id":"ev-029","category":"ev","word":"Speed feedback","ipa":"/spiːd ˈfiːdbæk/","zh":"转速反馈","example":"Speed feedback is used in closed-loop control.","exampleZh":"转速反馈用于闭环控制。"},{"id":"ev-030","category":"ev","word":"Motor efficiency","ipa":"/ˈmoʊtər ɪˈfɪʃənsi/","zh":"电机效率","example":"Motor efficiency changes with load and speed.","exampleZh":"电机效率随负载和转速变化。"},{"id":"ev-031","category":"ev","word":"Charging station","ipa":"/ˈtʃɑːrdʒɪŋ ˈsteɪʃən/","zh":"充电站","example":"The nearest charging station is five kilometers away.","exampleZh":"最近的充电站距离五公里。"},{"id":"ev-032","category":"ev","word":"Charge point","ipa":"/tʃɑːrdʒ pɔɪnt/","zh":"充电桩（更自然的英语表达）","example":"There are four charge points in the parking lot.","exampleZh":"停车场有四个充电桩。"},{"id":"ev-033","category":"ev","word":"Charging connector","ipa":"/ˈtʃɑːrdʒɪŋ kəˈnɛktər/","zh":"充电连接器","example":"Inspect the charging connector for damag "zh":"变量泵","example":"A variable displacement pump adjusts its output flow.","exampleZh":"变量泵调节输出流量。"},{"id":"mining-130","category":"mining","word":"Load sensing","ipa":"/lˈoʊd sˈɛnsɪŋ/","zh":"负载敏感控制","example":"Load sensing adjusts pump output to demand.","exampleZh":"负载敏感控制根据需求调整泵输出。"},{"id":"mining-131","category":"mining","word":"Proportional valve","ipa":"/prʌpˈɔrʃʌnʌl vˈælv/","zh":"比例阀","example":"The proportional valve controls actuator motion.","exampleZh":"比例阀控制执行机构动作。"},{"id":"mining-132","category":"mining","word":"Solenoid valve","ipa":"/solenoid vˈælv/","zh":"电磁阀","example":"The solenoid valve switches the hydraulic circuit.","exampleZh":"电磁阀切换液压回路。"},{"id":"mining-133","category":"mining","word":"Valve spool","ipa":"/vˈælv spˈul/","zh":"阀芯","example":"A stuck valve spool may prevent movement.","exampleZh":"阀芯卡滞可能导致无法动作。"},{"id":"mining-134","category":"mining","word":"Hydraulic accumulator","ipa":"/haɪdrˈɔlɪk ʌkjˈumjʌlˌeɪtɝ/","zh":"液压蓄能器","example":"The hydraulic accumulator stores pressure energy.","exampleZh":"液压蓄能器储存压力能。"},{"id":"mining-135","category":"mining","word":"Pressure transducer","ipa":"/prˈɛʃɝ trænsdˈusɝ/","zh":"压力变送器","example":"The pressure transducer outputs an electrical signal.","exampleZh":"压力变送器输出电信号。"},{"id":"mining-136","category":"mining","word":"Temperature switch","ipa":"/tˈɛmprʌtʃɝ swˈɪtʃ/","zh":"温度开关","example":"The temperature switch activates the cooling fan.","exampleZh":"温度开关启动散热风扇。"},{"id":"mining-137","category":"mining","word":"Oil level sensor","ipa":"/ˈɔɪl lˈɛvʌl sˈɛnsɝ/","zh":"油位传感器","example":"The oil level sensor warns of low hydraulic oil.","exampleZh":"油位传感器在液压油不足时报警。"},{"id":"mining-138","category":"mining","word":"Oil contamination","ipa":"/ˈɔɪl kʌntˌæmʌnˈeɪʃʌn/","zh":"油液污染","example":"Oil contamination increases component wear.","exampleZh":"油液污染会加剧部件磨损。"},{"id":"mining-139","category":"mining","word":"Filter blockage","ipa":"/fˈɪltɝ blˈɑkɪdʒ/","zh":"滤芯堵塞","example":"Filter blockage raises the differential pressure.","exampleZh":"滤芯堵塞会增大压差。"},{"id":"mining-140","category":"mining","word":"Differential pressure","ipa":"/dˌɪfɝˈɛnʃʌl prˈɛʃɝ/","zh":"压差","example":"Differential pressure is measured across the filter.","exampleZh":"测量滤芯两端的压差。"},{"id":"mining-141","category":"mining","word":"PLC controller","ipa":"/plc kʌntrˈoʊlɝ/","zh":"可编程逻辑控制器","example":"The PLC controller coordinates drilling functions.","exampleZh":"PLC 控制器协调钻机功能。"},{"id":"mining-142","category":"mining","word":"Human machine interface","ipa":"/hjˈumʌn mʌʃˈin ˈɪntɝfˌeɪs/","zh":"人机界面","example":"The human machine interface displays machine status.","exampleZh":"人机界面显示设备状态。"},{"id":"mining-143","category":"mining","word":"Control parameter","ipa":"/kʌntrˈoʊl pɝˈæmʌtɝ/","zh":"控制参数","example":"A control parameter can be changed from the display.","exampleZh":"可以通过显示屏修改控制参数。"},{"id":"mining-144","category":"mining","word":"Parameter setpoint","ipa":"/pɝˈæmʌtɝ setpoint/","zh":"参数设定值","example":"The parameter setpoint is sent to the PLC.","exampleZh":"参数设定值被发送至 PLC。"},{"id":"mining-145","category":"mining","word":"Actual feedback","ipa":"/ˈæktʃʌwʌl fˈidbˌæk/","zh":"实际反馈值","example":"Actual feedback is compared with the command.","exampleZh":"实际反馈值与指令进行比较。"},{"id":"mining-146","category":"mining","word":"Interlock condition","ipa":"/ˌɪntɝlˈɑk kʌndˈɪʃʌn/","zh":"联锁条件","example":"All interlock conditions must be satisfied before motion.","exampleZh":"动作前必须满足所有联锁条件。"},{"id":"mining-147","category":"mining","word":"Sequence timeout","ipa":"/sˈikwʌns tˈaɪmˌaʊt/","zh":"流程超时","example":"Sequence timeout triggers a diagnostic alarm.","exampleZh":"流程超时会触发诊断报警。"},{"id":"mining-148","category":"mining","word":"Retry counter","ipa":"/ritrˈaɪ kˈaʊntɝ/","zh":"重试计数器","example":"The retry counter limits automatic recovery attempts.","exampleZh":"重试计数器限制自动恢复尝试次数。"},{"id":"mining-149","category":"mining","word":"Fault acknowledgment","ipa":"/fˈɔlt æknˈɑlɪdʒmʌnt/","zh":"故障确认","example":"Fault acknowledgment is required after troubleshooting.","exampleZh":"故障排查后需要确认故障。"},{"id":"mining-150","category":"mining","word":"Safe state","ipa":"/sˈeɪf stˈeɪt/","zh":"安全状态","example":"The controller returns to a safe state after a fault.","exampleZh":"发生故障后控制器返回安全状态。"},{"id":"mining-151","category":"mining","word":"Manual override","ipa":"/mˈænjuʌl ˈoʊvɝrˌaɪd/","zh":"手动覆盖控制","example":"Manual override is permitted only under safe conditions.","exampleZh":"只有满足安全条件才允许手动覆盖控制。"},{"id":"mining-152","category":"mining","word":"Commissioning test","ipa":"/kʌmˈɪʃʌnɪŋ tˈɛst/","zh":"调试测试","example":"A commissioning test verifies the new control logic.","exampleZh":"调试测试验证新的控制逻辑。"},{"id":"mining-153","category":"mining","word":"Functional test","ipa":"/fˈʌŋkʃʌnʌl tˈɛst/","zh":"功能测试","example":"The functional test checks every operating mode.","exampleZh":"功能测试检查每一种运行模式。"},{"id":"mining-154","category":"mining","word":"Maintenance interval","ipa":"/mˈeɪntʌnʌns ˈɪntɝvʌl/","zh":"维护周期","example":"Maintenance interval is based on operating hours.","exampleZh":"维护周期根据运行小时数确定。"},{"id":"mining-155","category":"mining","word":"Operating hours","ipa":"/ˈɑpɝˌeɪtɪŋ ˈaʊɝz/","zh":"运行小时数","example":"Operating hours are recorded for service planning.","exampleZh":"记录运行小时数以制定保养计划。"},{"id":"mining-156","category":"mining","word":"Idle hours","ipa":"/ˈaɪdʌl ˈaʊɝz/","zh":"怠速小时数","example":"Idle hours are shown on the maintenance page.","exampleZh":"怠速小时数显示在保养页面。"},{"id":"mining-157","category":"mining","word":"Fuel consumption","ipa":"/fjˈuʌl kʌnsˈʌmpʃʌn/","zh":"燃油消耗量","example":"Fuel consumption is tracked during operation.","exampleZh":"作业期间跟踪燃油消耗量。"},{"id":"mining-158","category":"mining","word":"Diesel exhaust fluid","ipa":"/dˈisʌl ɪɡzˈɔst flˈuʌd/","zh":"柴油机尾气处理液","example":"Diesel exhaust fluid level is monitored by the controller.","exampleZh":"控制器监测柴油机尾气处理液液位。"},{"id":"mining-159","category":"mining","word":"Service reminder","ipa":"/sˈɝvʌs rimˈaɪndɝ/","zh":"保养提醒","example":"A service reminder appears when maintenance is due.","exampleZh":"保养到期时显示保养提醒。"},{"id":"mining-160","category":"mining","word":"Drilling data logging","ipa":"/drˈɪlɪŋ dˈeɪtʌ lˈɔɡɪŋ/","zh":"钻进数据记录","example":"Drilling data logging supports fault analysis.","exampleZh":"钻进数据记录有助于故障分析。"}];</script>
<script>
(()=>{'use strict';
const BASE_WORDS=INITIAL_WORDS;
const CAT={daily:{label:'日常沟通',emoji:'💬'},ev:{label:'新能源汽车',emoji:'⚡'},mining:{label:'矿山工程',emoji:'⛏️'}};
const KEY='wordsprout.local.v1',EPOCH='2026-10-10',LEVELS=[1,3,7,14,30,60];
const main=document.getElementById('appMain'),datePill=document.getElementById('datePill');
const $=s=>document.querySelector(s);
const blank=()=>({version:1,records:{},daily:{},extras:[],settings:{accent:'en-US',rate:.83}});
let memoryOnly=false,state=blank(),tab='today',libraryScope='learned',categoryFilter='all',librarySearch='',libraryLimit=40,reviewScope='due',toastTimer=null,lastToday='';
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function readStore(){try{const t=localStorage.getItem(KEY);if(t){const p=JSON.parse(t);if(p&&typeof p==='object'){state={...blank(),...p,records:(p.records&&typeof p.records==='object')?p.records:{},daily:(p.daily&&typeof p.daily==='object')?p.daily:{},extras:Array.isArray(p.extras)?p.extras:[],settings:{...blank().settings,...(p.settings||{})}};}}}catch(e){memoryOnly=true;}}
function saveStore(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){memoryOnly=true;}}
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(day,n){const [y,m,d]=day.split('-').map(Number);return localDate(new Date(y,m-1,d+n,12));}
function daysApart(a,b){const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);}
function today(){return localDate();}
function listWords(){return BASE_WORDS.concat(state.extras);}
function buildDeck(){const groups={daily:[],ev:[],mining:[]};BASE_WORDS.forEach(w=>groups[w.category].push(w));const deck=[];for(let i=0;i<Math.max(...Object.values(groups).map(a=>a.length));i++){for(const c of ['daily','ev','mining'])if(groups[c][i])deck.push(groups[c][i]);}return deck.concat(state.extras);}
function dailyItems(day=today()){const deck=buildDeck(),cycle=Math.floor((Math.max(0,daysApart(EPOCH,day)))/Math.ceil(deck.length/10));const d=((daysApart(EPOCH,day)%Math.ceil(deck.length/10))+Math.ceil(deck.length/10))%Math.ceil(deck.length/10);const start=d*10;return {items:Array.from({length:10},(_,i)=>deck[(start+i)%deck.length]),dayNumber:d+1,daysTotal:Math.ceil(deck.length/10),cycle};}
function getRecord(id){return state.records[id]||{};}
function completion(day=today()){const words=dailyItems(day).items;return words.filter(w=>state.daily[day]?.[w.id]).length;}
function getStreak(){let d=today();if(completion(d)<5)d=addDays(d,-1);let s=0;for(let i=0;i<400;i++){if(completion(d)===10){s++;d=addDays(d,-1);}else break;}return s;}
function getLearned(){return listWords().filter(w=>!!getRecord(w.id).seen);}
function getDue(){return getLearned().filter(w=>getRecord(w.id).due && getRecord(w.id).due<=today()).sort((a,b)=>(getRecord(a.id).due||'').localeCompare(getRecord(b.id).due||''));}
function uiDate(day){const [y,m,d]=day.split('-').map(Number);return `${m}月${d}日`;}
function stats(){return {learned:getLearned().length,due:getDue().length,streak:getStreak()};}
function buttonAction(action,w,text,cls=''){return `<button class="btn ${cls}" data-action="${action}" data-id="${escapeHtml(w.id)}">${text}</button>`;}
function topActions(w){const r=getRecord(w.id);return `<div class="card-top"><span class="category">${CAT[w.category]?.emoji||'📚'} ${CAT[w.category]?.label||'自定义'}</span><button class="favorite ${r.favorite?'active':''}" data-action="favorite" data-id="${escapeHtml(w.id)}" aria-label="${r.favorite?'取消收藏':'收藏'}" title="收藏">${r.favorite?'💛':'🤍'}</button></div>`;}
function fullCard(w,index,mode='today'){
const r=getRecord(w.id),picked=state.daily[today()]?.[w.id];
const status=mode==='today'&&picked?`<span class="status-tag ${picked==='hard'?'hard':''}">${picked==='hard'?'🔁 已安排复习':'✅ 今日已完成'}</span>`:mode==='review'?`<span class="status-tag hard">📆 到期 ${escapeHtml(uiDate(r.due||today()))}</span>`:'';
return `<article class="panel word-card ${escapeHtml(w.category)}" id="card-${escapeHtml(w.id)}">${topActions(w)}
<div style="display:flex;align-items:center;gap:10px;margin-top:9px"><span class="card-num">CARD ${String(index+1).padStart(2,'0')}</span>${status}</div>
<h3 class="word-text">${escapeHtml(w.word)}</h3><div class="ipa">${escapeHtml(w.ipa)}</div>
<div class="cn">${escapeHtml(w.zh)}</div>
<div class="actions" style="margin-top:8px">${buttonAction('speak',w,'🔊 听单词','sound')}${buttonAction('speak-example',w,'🎧 听例句','sound2')}</div>
<div class="divider-dashed"></div><div class="example-label"><span>✏️ EXAMPLE SENTENCE</span><span>🌟</span></div>
<div class="example-en">${escapeHtml(w.example)}</div><div class="example-zh">${escapeHtml(w.exampleZh)}</div>
<div class="divider-dashed"></div><div class="actions">
${buttonAction('hard',w,'🔄 再练练','hard')}
${buttonAction('easy',w,'✨ 掌握啦','easy')}
</div></article>`;}
function miniCard(w){
const r=getRecord(w.id),due=r.due?`下次复习：${uiDate(r.due)}`:'尚未学习';
return `<article class="mini-card"><div class="mini-head"><div><div class="mini-word">${escapeHtml(w.word)}</div><div class="mini-meta">${escapeHtml(w.ipa)} · ${CAT[w.category]?.label||'自定义'}</div><div class="mini-zh">${escapeHtml(w.zh)}</div></div>
<button class="favorite ${r.favorite?'active':''}" data-action="favorite" data-id="${escapeHtml(w.id)}" aria-label="${r.favorite?'取消收藏':'收藏'}">${r.favorite?'💛':'🤍'}</button></div>
<div class="mini-example">${escapeHtml(w.example)}<div style="color:#919aaa">${escapeHtml(w.exampleZh)}</div></div>
<div class="mini-meta">${escapeHtml(due)}</div>
<div class="mini-actions">${buttonAction('speak',w,'🔊 单词','sound')}${buttonAction('speak-example',w,'🎧 例句','sound2')}${buttonAction('practice',w,'🧠 加入复习','outline')}</div></article>`;}
function todayPage(){
const t=today(),pack=dailyItems(),count=completion(),s=stats(),progress=count*10;
const heading=pack.cycle>0?'新的一轮，复习更牢固':'每天10个，轻松积累';
const cycleNote=pack.cycle>0?`你已进入第 ${pack.cycle+1} 轮词库学习，本轮会再次出现以前学过的词。可以从设置中导入新词扩充词库。`:`第 ${pack.dayNumber} / ${pack.daysTotal} 天 · 三个领域交替学习`;
return `<section class="panel hero"><div class="hero-top"><div><span class="eyebrow">☀️ TODAY'S LITTLE WIN</span><h1>${heading}<br/>英语长出新芽 🌱</h1><p>${escapeHtml(cycleNote)}</p></div><span class="hero-art" aria-hidden="true">📖🐣</span></div>
<div class="progress-head"><span>🍀 今日打卡进度</span><span>${count} / 10 已完成</span></div><div class="progress-track" role="progressbar" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="10"><div class="progress-fill" style="width:${progress}%"></div></div></section>
<div class="stats"><div class="stat"><b>${s.streak} 🔥</b><small>连续学习天数</small></div><div class="stat"><b>${s.learned} 📚</b><small>已接触词组</small></div><div class="stat"><b>${s.due} 🧠</b><small>待复习词组</small></div></div>
<div class="section-heading"><h2>🪄 今天的 10 张卡片</h2><small>${escapeHtml(uiDate(t))}</small></div>
${pack.items.map((w,i)=>fullCard(w,i)).join('')}
${count===10?'<div class="empty" style="margin-top:18px;background:#ddf6e7"><div class="empty-art">🏆🌸</div><h3>今天的10个词学完啦！</h3><p>明天自动切换到下一组。到「复习」看看需要巩固的内容吧。</p></div>':''}`;
}
function filterChips(selected,items,attr){return items.map(([key,label])=>`<button class="chip ${selected===key?'active':''}" data-${attr}="${escapeHtml(key)}" aria-pressed="${selected===key}">${escapeHtml(label)}</button>`).join('');}
function reviewPage(){
const s=stats(),items=reviewScope==='due'?getDue():getLearned().slice().reverse();
return `<section class="panel review-intro"><h1>🧠 记忆补给站</h1><p>按复习间隔自动提醒：掌握越牢，间隔越长。点「再练练」会重新安排明天复习。</p></section>
<div class="stats"><div class="stat"><b>${s.due}</b><small>今日到期</small></div><div class="stat"><b>${s.learned}</b><small>学习记录</small></div><div class="stat"><b>${s.streak} 🔥</b><small>连续打卡</small></div></div>
<div class="filterbar">${filterChips(reviewScope,[['due','⏰ 今日待复习'],['all','📖 全部已学']],'review-filter')}</div>
<div class="section-heading"><h2>${reviewScope==='due'?'今天要巩固的词':'已学词语回顾'}</h2><small>${items.length} 个</small></div>
${items.length?items.map((w,i)=>fullCard(w,i,'review')).join(''):`<div class="empty"><div class="empty-art">🎉</div><h3>${reviewScope==='due'?'没有到期的复习任务':'暂时没有学习记录'}</h3><p>${reviewScope==='due'?'做得好！今天的新词会按照复习间隔进入这里。':'先去「今日」学习10个词吧。'}</p></div>`}`;
}
function libraryPage(){
const learned=new Set(getLearned().map(w=>w.id)),all=listWords();
const filtered=all.filter(w=>(libraryScope==='all'||(libraryScope==='learned'&&learned.has(w.id))||(libraryScope==='favorite'&&getRecord(w.id).favorite))&&(categoryFilter==='all'||w.category===categoryFilter)&&(`${w.word} ${w.zh} ${w.example} ${w.exampleZh}`.toLowerCase().includes(librarySearch.toLowerCase())));
return `<section class="panel library-head"><h1>📚 我的单词花园</h1><p>内置 ${BASE_WORDS.length} 个精选词组，已经学习 ${learned.size} 个。也可以查看所有词、收藏与搜索。</p></section>
<div class="search"><span>🔎</span><input id="wordSearch" placeholder="搜索单词、中文或例句…" autocomplete="off" value="${escapeHtml(librarySearch)}" aria-label="搜索词库"/></div>
<div class="filterbar">${filterChips(libraryScope,[['learned','🌱 已学习'],['favorite','💛 已收藏'],['all','📚 全部词库']],'library-scope')}</div>
<div class="filterbar">${filterChips(categoryFilter,[['all','全部领域'],['daily','💬 日常'],['ev','⚡ 新能源'],['mining','⛏️ 矿山']],'category-filter')}</div>
<div class="section-heading"><h2>词语列表</h2><small>匹配 ${filtered.length} 个</small></div>
${filtered.length?filtered.slice(0,libraryLimit).map(miniCard).join('')+ (filtered.length>libraryLimit?`<button class="btn primary" style="display:flex;width:100%;margin:15px 0" data-action="more">查看更多（剩余 ${filtered.length-libraryLimit} 个）</button>`:''):`<div class="empty"><div class="empty-art">🪴</div><h3>这里还没有内容</h3><p>学习新词、收藏喜欢的词，或切换到全部词库看看。</p></div>`}`;
}
function historyMarkup(){let ds=[];for(let i=6;i>=0;i--){const d=addDays(today(),-i),n=completion(d);ds.push(`<div class="history-day ${n===10?'done':n>0?'partial':''}"><b>${new Date(d+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'})}</b><small>${n}/10</small></div>`);}return `<div class="history-list">${ds.join('')}</div>`;}
function settingsPage(){
const s=stats(),pack=dailyItems();
return `<section class="panel settings-head"><h1>⚙️ 学习小设置</h1><p>朗读使用手机系统语音；学习进度保存在本机，不需注册账号。</p></section>
<section class="panel settings-block"><h3 class="subhead">🎙️ 发音设置</h3>
<div class="setting-row"><label for="accent">英语口音</label><select id="accent"><option value="en-US" ${state.settings.accent==='en-US'?'selected':''}>🇺🇸 美式英语</option><option value="en-GB" ${state.settings.accent==='en-GB'?'selected':''}>🇬🇧 英式英语</option></select></div>
<div class="setting-row"><label for="speechRate">朗读速度 <span id="rateLabel">${Number(state.settings.rate||.83).toFixed(2)}×</span></label><input id="speechRate" type="range" min=".6" max="1.1" step=".05" value="${Number(state.settings.rate||.83)}" aria-label="朗读速度"/></div>
<div class="notice">🔊 需要允许手机浏览器播放声音。系统语音是否支持离线朗读，取决于设备内已安装的英语语音包。</div></section>
<section class="panel settings-block"><h3 class="subhead">🗓️ 最近 7 天</h3>${historyMarkup()}<div class="setting-row"><span style="font-size:13px;font-weight:850">已学习 ${s.learned} / ${listWords().length} 词</span><span style="font-size:13px;font-weight:900">🔥 ${s.streak} 天</span></div></section>
<section class="panel settings-block"><h3 class="subhead">💾 备份与扩充</h3><p style="font-size:13px;line-height:1.75;color:var(--muted)">你可以导出学习记录备份到手机文件中，再导入恢复。也支持导入新词 JSON，避免内置词库学完后重复。</p>
<div class="setting-actions"><button class="btn primary" data-action="export">📤 导出学习记录</button><button class="btn outline" data-action="import">📥 导入备份 / 新词</button></div>
<div class="notice">🍎 首版内置480词，按日期连续48天不重复，第49天开始新一轮巩固。导入新增词组可延长学习周期；不会自动从互联网抓取新单词。</div></section>
<section class="panel settings-block"><h3 class="subhead">🧹 数据管理</h3><div class="setting-actions"><button class="btn outline" data-action="clear">🗑️ 清空本机学习进度</button></div><div class="notice">⚠️ 浏览器清理网站数据、切换设备或使用无痕模式可能导致记录丢失，建议定期导出备份。${memoryOnly?'当前浏览器无法保存记录，请在 Safari / Chrome 中以 HTTPS 网站方式打开。':''}</div></section>
<section class="panel settings-block"><h3 class="subhead">🌼 如何添加到手机桌面</h3><p style="font-size:13px;line-height:1.9;color:#697589">iPhone：用 Safari 打开已部署的 HTTPS 网页 → 分享 →「添加到主屏幕」。<br/>安卓：用 Chrome 打开网页 → 菜单 →「添加到主屏幕」或「安装应用」。</p></section>`;
}
function render(preserve=true){const y=preserve?window.scrollY:0;const now=today();lastToday=now;datePill.textContent=`📅 ${uiDate(now)}`;main.innerHTML=tab==='today'?todayPage():tab==='review'?reviewPage():tab==='library'?libraryPage():settingsPage();
document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));else window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function lookup(id){return listWords().find(w=>w.id===id);}
function mark(id,result){const word=lookup(id);if(!word)return;const r=getRecord(id),repeat=result==='easy'?Math.min(6,(r.repetitions||0)+1):0;const interval=result==='easy'?LEVELS[repeat-1]:1;
state.records[id]={...r,seen:true,repetitions:repeat,interval,due:addDays(today(),interval),last:today(),lastResult:result};
if(tab==='today'){if(!state.daily[today()])state.daily[today()]={};state.daily[today()][id]=result;}
saveStore();render();toast(result==='easy'?`✨ 已学会，${interval} 天后复习`:'🌼 已安排明天再练');}
// Keep the utterance referenced: some mobile WebKit versions otherwise stop it early.
let activeUtterance=null;
let speechRequest=0;
let speechStarted=false;
function speak(t){
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
  toast('此浏览器不支持系统朗读，请尝试 Safari');return;
 }
 const synth=window.speechSynthesis;
 const request=++speechRequest;
 try{
  // Explicit user gesture enters here; do not defer the initial speak to a timer.
  synth.cancel();
  const u=new SpeechSynthesisUtterance(t);
  activeUtterance=u;
  speechStarted=false;
  u.lang=state.settings.accent||'en-US';
  u.rate=Number(state.settings.rate)||0.83;
  u.pitch=1;
  u.volume=1;
  const voices=synth.getVoices();
  const preferred=voices.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase()&&v.localService)
   ||voices.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())
   ||voices.find(v=>v.lang.toLowerCase().startsWith('en')&&v.localService)
   ||voices.find(v=>v.lang.toLowerCase().startsWith('en'));
  if(preferred)u.voice=preferred;
  u.onstart=()=>{if(request===speechRequest)speechStarted=true;};
  u.onend=()=>{if(request===speechRequest)activeUtterance=null;};
  u.onerror=(e)=>{
   if(request!==speechRequest)return;
   activeUtterance=null;
   const code=e.error||'unknown';
   if(code==='canceled'||code==='interrupted')return;
   toast('朗读失败（'+code+'），请在 Safari 中重试');
  };
  synth.speak(u);
  // iOS may leave synthesis paused after returning from background.
  if(synth.paused)synth.resume();
 }catch(e){activeUtterance=null;toast('无法启动朗读：'+(e.message||'请重试'));}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&window.speechSynthesis?.paused){
  try{window.speechSynthesis.resume();}catch(e){}
 }
});
function downloadJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function validExtra(w){return w&&typeof w==='object'&&['word','ipa','zh','example','exampleZh'].every(k=>typeof w[k]==='string'&&w[k].trim()&&w[k].length<501);}
async function doImport(file){if(!file||file.size>2_000_000){toast('文件不能超过2MB');return;}try{const obj=JSON.parse(await file.text());const isBackup=obj&&obj.version===1&&obj.records&&obj.daily;
if(isBackup){if(!window.confirm('导入备份会替换本机的学习记录和自定义词库，确定继续吗？'))return;
const rec=obj.records&&typeof obj.records==='object'?obj.records:{},day=obj.daily&&typeof obj.daily==='object'?obj.daily:{};
const ex=Array.isArray(obj.extras)?obj.extras.filter(validExtra).slice(0,1000):[];
state={...blank(),records:rec,daily:day,extras:ex,settings:{...blank().settings,...(obj.settings||{})}};saveStore();render(false);toast('✅ 备份已恢复');return;}
const words=Array.isArray(obj)?obj:Array.isArray(obj.words)?obj.words:null;if(!words||!words.length){toast('格式不正确：需要 words 数组或备份文件');return;}
const known=new Set(listWords().map(w=>w.word.toLowerCase())),newWords=[];
for(const row of words.slice(0,1000)){if(!validExtra(row)||known.has(row.word.toLowerCase()))continue;known.add(row.word.toLowerCase());
newWords.push({id:'custom-'+Date.now().toString(36)+'-'+newWords.length,category:['daily','ev','mining'].includes(row.category)?row.category:'daily',word:row.word.trim(),ipa:row.ipa.trim(),zh:row.zh.trim(),example:row.example.trim(),exampleZh:row.exampleZh.trim()});}
state.extras.push(...newWords);saveStore();render(false);toast(`🌱 已导入 ${newWords.length} 个新词`);}catch(e){toast('文件读取失败，请检查 JSON 格式');}}
document.addEventListener('click',ev=>{
const nav=ev.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render(false);return;}
const filter=ev.target.closest('[data-library-scope],[data-category-filter],[data-review-filter]');if(filter){if(filter.dataset.libraryScope){libraryScope=filter.dataset.libraryScope;libraryLimit=40;}if(filter.dataset.categoryFilter){categoryFilter=filter.dataset.categoryFilter;libraryLimit=40;}if(filter.dataset.reviewFilter)reviewScope=filter.dataset.reviewFilter;render();return;}
const b=ev.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,word=id?lookup(id):null;
if(action==='speak'&&word){speak(word.word);return;}if(action==='speak-example'&&word){speak(word.example);return;}
if(action==='favorite'&&word){const r=getRecord(id);state.records[id]={...r,favorite:!r.favorite};saveStore();render();toast(!r.favorite?'💛 已收藏':'🤍 已取消收藏');return;}
if(action==='easy'||action==='hard'){mark(id,action);return;}
if(action==='practice'&&word){const r=getRecord(id);state.records[id]={...r,seen:true,due:today(),repetitions:r.repetitions||0};saveStore();tab='review';reviewScope='due';render(false);toast('🧠 已加入今天的复习');return;}
if(action==='more'){libraryLimit+=40;render();return;}
if(action==='export'){downloadJson({version:1,exportedAt:new Date().toISOString(),records:state.records,daily:state.daily,extras:state.extras,settings:state.settings},`word-sprout-backup-${today()}.json`);toast('📁 备份文件已导出');return;}
if(action==='import'){$('#importFile').click();return;}
if(action==='clear'){if(window.confirm('确定清空本机学习记录吗？此操作无法撤销。请先导出备份。')){state=blank();saveStore();render(false);toast('本机学习记录已清空');}return;}
});
document.addEventListener('input',ev=>{if(ev.target.id==='wordSearch'){librarySearch=ev.target.value;libraryLimit=40;const at=ev.target.selectionStart;render();const inp=$('#wordSearch');inp.focus();inp.setSelectionRange(at,at);}if(ev.target.id==='speechRate'){state.settings.rate=Number(ev.target.value);const label=$('#rateLabel');if(label)label.textContent=Number(ev.target.value).toFixed(2)+'×';saveStore();}});
document.addEventListener('change',ev=>{if(ev.target.id==='accent'){state.settings.accent=ev.target.value;saveStore();toast('🎙️ 发音偏好已更新');}});
$('#importFile').addEventListener('change',async ev=>{await doImport(ev.target.files?.[0]);ev.target.value='';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastToday)render(false);});
window.addEventListener('focus',()=>{if(today()!==lastToday)render(false);});
readStore();render(false);
if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
})();
</script>
</body></html>
