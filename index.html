<script>const INITIAL_WORDS = [{"id":"daily-001","category":"daily","word":"Good morning","ipa":"/ɡʊd ˈmɔːrnɪŋ/","zh":"早上好","example":"Good morning! Did you sleep well?","exampleZh":"早上好！昨晚睡得好吗？"},{"id":"daily-002","category":"daily","word":"How are you?","ipa":"/haʊ ɑːr juː/","zh":"你好吗？","example":"How are you doing today?","exampleZh":"你今天过得怎么样？"},{"id":"daily-003","category":"daily","word":"Nice to meet you","ipa":"/naɪs tə miːt juː/","zh":"很高兴认识你","example":"Nice to meet you, I'm Alex.","exampleZh":"很高兴认识你，我叫亚历克斯。"},{"id":"daily-004","category":"daily","word":"Could you help me?","ipa":"/kʊd juː hɛlp miː/","zh":"你能帮帮我吗？","example":"Could you help me carry this box?","exampleZh":"你能帮我搬这个箱子吗？"},{"id":"daily-005","category":"daily","word":"Thank you so much","ipa":"/θæŋk juː soʊ mʌtʃ/","zh":"非常感谢你","example":"Thank you so much for your support.","exampleZh":"非常感谢你的支持。"},{"id":"daily-006","category":"daily","word":"You're welcome","ipa":"/jʊr ˈwɛlkəm/","zh":"不客气","example":"You're welcome. I'm happy to help.","exampleZh":"不客气，我很乐意帮忙。"},{"id":"daily-007","category":"daily","word":"Excuse me","ipa":"/ɪkˈskjuːz miː/","zh":"打扰一下；劳驾","example":"Excuse me, is this seat taken?","exampleZh":"打扰一下，这个座位有人吗？"},{"id":"daily-008","category":"daily","word":"I'm sorry","ipa":"/aɪm ˈsɑːri/","zh":"对不起","example":"I'm sorry I missed your call.","exampleZh":"对不起，我没接到你的电话。"},{"id":"daily-009","category":"daily","word":"No problem","ipa":"/noʊ ˈprɑːbləm/","zh":"没问题","example":"No problem, I can send it today.","exampleZh":"没问题，我今天可以发给你。"},{"id":"daily-010","category":"daily","word":"See you later","ipa":"/siː juː ˈleɪtər/","zh":"回头见","example":"See you later at the office.","exampleZh":"办公室见。"},{"id":"daily-011","category":"daily","word":"What's your name?","ipa":"/wʌts jʊr neɪm/","zh":"你叫什么名字？","example":"What's your name, please?","exampleZh":"请问你叫什么名字？"},{"id":"daily-012","category":"daily","word":"Where are you from?","ipa":"/wɛr ɑːr juː frʌm/","zh":"你来自哪里？","example":"Where are you from originally?","exampleZh":"你原来是哪里人？"},{"id":"daily-013","category":"daily","word":"What do you do?","ipa":"/wʌt duː juː duː/","zh":"你做什么工作？","example":"What do you do at your company?","exampleZh":"你在公司负责什么工作？"},{"id":"daily-014","category":"daily","word":"I work as an engineer","ipa":"/aɪ wɜːrk æz ən ˌɛndʒɪˈnɪr/","zh":"我是一名工程师","example":"I work as an engineer in the vehicle industry.","exampleZh":"我在汽车行业担任工程师。"},{"id":"daily-015","category":"daily","word":"How much is it?","ipa":"/haʊ mʌtʃ ɪz ɪt/","zh":"多少钱？","example":"How much is it for two tickets?","exampleZh":"两张票多少钱？"},{"id":"daily-016","category":"daily","word":"I'd like a coffee","ipa":"/aɪd laɪk ə ˈkɔːfi/","zh":"我想要一杯咖啡","example":"I'd like a coffee without sugar.","exampleZh":"我想要一杯不加糖的咖啡。"},{"id":"daily-017","category":"daily","word":"Could I have the menu?","ipa":"/kʊd aɪ hæv ðə ˈmɛnjuː/","zh":"能给我菜单吗？","example":"Could I have the menu, please?","exampleZh":"请给我一份菜单好吗？"},{"id":"daily-018","category":"daily","word":"Do you have Wi-Fi?","ipa":"/duː juː hæv ˈwaɪ faɪ/","zh":"这里有无线网络吗？","example":"Do you have Wi-Fi in the meeting room?","exampleZh":"会议室有无线网络吗？"},{"id":"daily-019","category":"daily","word":"Where is the restroom?","ipa":"/wɛr ɪz ðə ˈrɛstruːm/","zh":"洗手间在哪里？","example":"Where is the restroom on this floor?","exampleZh":"这一层的洗手间在哪里？"},{"id":"daily-020","category":"daily","word":"I'm on my way","ipa":"/aɪm ɑːn maɪ weɪ/","zh":"我正在路上","example":"I'm on my way and will be there soon.","exampleZh":"我正在路上，很快就到。"},{"id":"daily-021","category":"daily","word":"Running late","ipa":"/ˈrʌnɪŋ leɪt/","zh":"要迟到了","example":"I'm running late because of traffic.","exampleZh":"因为堵车，我要迟到了。"},{"id":"daily-022","category":"daily","word":"Take your time","ipa":"/teɪk jʊr taɪm/","zh":"别着急；慢慢来","example":"Take your time with the report.","exampleZh":"报告可以慢慢做。"},{"id":"daily-023","category":"daily","word":"Sounds good","ipa":"/saʊndz ɡʊd/","zh":"听起来不错","example":"Friday afternoon sounds good to me.","exampleZh":" ":"/ɡoʊ streɪt/","zh":"直走","example":"Go straight for two blocks.","exampleZh":"直走两个街区。"},{"id":"daily-071","category":"daily","word":"How far is it?","ipa":"/haʊ fɑːr ɪz ɪt/","zh":"有多远？","example":"How far is it from here to the factory?","exampleZh":"从这里到工厂有多远？"},{"id":"daily-072","category":"daily","word":"Is it available?","ipa":"/ɪz ɪt əˈveɪləbəl/","zh":"有货吗；可以用吗？","example":"Is this spare part available today?","exampleZh":"这个备件今天有货吗？"},{"id":"daily-073","category":"daily","word":"Out of stock","ipa":"/aʊt əv stɑːk/","zh":"缺货","example":"The replacement cable is out of stock.","exampleZh":"替换电缆缺货了。"},{"id":"daily-074","category":"daily","word":"Could you send it?","ipa":"/kʊd juː sɛnd ɪt/","zh":"你能把它发过来吗？","example":"Could you send it as a PDF?","exampleZh":"你能把它以 PDF 形式发过来吗？"},{"id":"daily-075","category":"daily","word":"I'm looking for","ipa":"/aɪm ˈlʊkɪŋ fɔːr/","zh":"我正在找……","example":"I'm looking for the service manual.","exampleZh":"我正在找维修手册。"},{"id":"daily-076","category":"daily","word":"Let me introduce","ipa":"/lɛt miː ˌɪntrəˈduːs/","zh":"让我介绍一下","example":"Let me introduce our project team.","exampleZh":"让我介绍一下我们的项目团队。"},{"id":"daily-077","category":"daily","word":"Take notes","ipa":"/teɪk noʊts/","zh":"做笔记","example":"Please take notes during the training.","exampleZh":"培训期间请做好笔记。"},{"id":"daily-078","category":"daily","word":"Stay in touch","ipa":"/steɪ ɪn tʌtʃ/","zh":"保持联系","example":"Let's stay in touch after the exhibition.","exampleZh":"展会结束后保持联系。"},{"id":"daily-079","category":"daily","word":"Have a great day","ipa":"/hæv ə ɡreɪt deɪ/","zh":"祝你今天愉快","example":"Thanks for calling, and have a great day!","exampleZh":"感谢来电，祝你今天愉快！"},{"id":"daily-080","category":"daily","word":"Could you give me a hand?","ipa":"/kʊd juː ɡɪv miː ə hænd/","zh":"你能搭把手吗？","example":"Could you give me a hand with this case?","exampleZh":"你能帮我搬一下这个箱子吗？"},{"id":"ev-001","category":"ev","word":"Electric vehicle","ipa":"/ɪˈlɛktrɪk ˈviːɪkəl/","zh":"电动汽车","example":"This elec -023","category":"ev","word":"Inverter","ipa":"/ɪnˈvɜːrtər/","zh":"逆变器","example":"The inverter converts DC power to AC power.","exampleZh":"逆变器将直流电转换为交流电。"},{"id":"ev-024","category":"ev","word":"Traction motor","ipa":"/ˈtrækʃən ˈmoʊtər/","zh":"驱动电机","example":"The traction motor drives the wheels.","exampleZh":"驱动电机带动车轮转动。"},{"id":"ev-025","category":"ev","word":"Motor controller","ipa":"/ˈmoʊtər kənˈtroʊlər/","zh":"电机控制器","example":"The motor controller regulates torque.","exampleZh":"电机控制器调节扭矩。"},{"id":"ev-026","category":"ev","word":"Electric drive unit","ipa":"/ɪˈlɛktrɪk draɪv ˈjuːnɪt/","zh":"电驱动总成","example":"The electric drive unit combines a motor and gearbox.","exampleZh":"电驱动总成集成电机与减速箱。"},{"id":"ev-027","category":"ev","word":"Regenerative braking","ipa":"/rɪˈdʒɛnərətɪv ˈbreɪkɪŋ/","zh":"能量回收制动","example":"Regenerative braking charges the battery while slowing down.","exampleZh":"能量回收制动在减速时为电池充电。"},{"id":"ev-028","category":"ev","word":"Torque request","ipa":"/tɔːrk rɪˈkwɛst/","zh":"扭矩请求","example":"The controller sends a torque request to the motor.","exampleZh":"控制器向电机发送扭矩请求。"},{"id":"ev-029","category":"ev","word":"Speed feedback","ipa":"/spiːd ˈfiːdbæk/","zh":"转速反馈","example":"Speed feedback is used in closed-loop control.","exampleZh":"转速反馈用于闭环控制。"},{"id":"ev-030","category":"ev","word":"Motor efficiency","ipa":"/ˈmoʊtər ɪˈfɪʃənsi/","zh":"电机效率","example":"Motor efficiency changes with load and speed.","exampleZh":"电机效率随负载和转速变化。"},{"id":"ev-031","category":"ev","word":"Charging station","ipa":"/ˈtʃɑːrdʒɪŋ ˈsteɪʃən/","zh":"充电站","example":"The nearest charging station is five kilometers away.","exampleZh":"最近的充电站距离五公里。"},{"id":"ev-032","category":"ev","word":"Charge point","ipa":"/tʃɑːrdʒ pɔɪnt/","zh":"充电桩（更自然的英语表达）","example":"There are four charge points in the parking lot.","exampleZh":"停车场有四个充电桩。"},{"id":"ev-033","category":"ev","word":"Charging connector","ipa":"/ˈtʃɑːrdʒɪŋ kəˈnɛktər/","zh":"充电连接器","example":"Inspect the charging connector for damag "螺纹损伤","example":"Thread damage may make disassembly difficult.","exampleZh":"螺纹损伤可能导致拆卸困难。"},{"id":"mining-040","category":"mining","word":"Make up a joint","ipa":"/meɪk ʌp ə dʒɔɪnt/","zh":"旋紧螺纹连接","example":"Make up a joint to the specified torque.","exampleZh":"按规定扭矩旋紧接头。"},{"id":"mining-041","category":"mining","word":"Break out a joint","ipa":"/breɪk aʊt ə dʒɔɪnt/","zh":"旋松螺纹连接","example":"Break out a joint only after securing the lower rod.","exampleZh":"固定下方钻杆后再松开接头。"},{"id":"mining-042","category":"mining","word":"Breakout torque","ipa":"/ˈbreɪkaʊt tɔːrk/","zh":"卸扣扭矩","example":"Excessive breakout torque can damage the threads.","exampleZh":"卸扣扭矩过大可能损坏螺纹。"},{"id":"mining-043","category":"mining","word":"Stuck drill string","ipa":"/stʌk drɪl strɪŋ/","zh":"卡钻","example":"A stuck drill string requires a controlled recovery procedure.","exampleZh":"卡钻需要按受控流程处理。"},{"id":"mining-044","category":"mining","word":"Reverse rotation","ipa":"/rɪˈvɜːrs roʊˈteɪʃən/","zh":"反转","example":"The control logic checks conditions before reverse rotation.","exampleZh":"控制逻辑在反转前检查工况。"},{"id":"mining-045","category":"mining","word":"Mast","ipa":"/mæst/","zh":"钻机桅杆","example":"The mast supports the feed mechanism.","exampleZh":"桅杆支撑推进机构。"},{"id":"mining-046","category":"mining","word":"Boom","ipa":"/buːm/","zh":"动臂","example":"The boom positions the drill at the target.","exampleZh":"动臂将钻机定位到目标位置。"},{"id":"mining-047","category":"mining","word":"Stabilizer","ipa":"/ˈsteɪbəlaɪzər/","zh":"稳定装置","example":"The stabilizer improves machine stability.","exampleZh":"稳定装置提高设备稳定性。"},{"id":"mining-048","category":"mining","word":"Outrigger","ipa":"/ˈaʊtrɪɡər/","zh":"支腿","example":"Lower the outriggers on suitable ground.","exampleZh":"在适合的地面上放下支腿。"},{"id":"mining-049","category":"mining","word":"Machine leveling","ipa":"/məˈʃiːn ˈlɛvəlɪŋ/","zh":"设备调平","example":"Machine leveling is checked before operation.","exampleZh":"作业前检查设备调平状态。"},{"id":"mining-050","category":"mining","word":"Hydraulic pump","ipa":"/haɪˈdrɔːlɪk pʌmp/","zh":"液压泵","example":"The hydraulic pump supplies oil flow.","exampleZh":"液压泵提供液压油流量。"},{"id":"mining-051","category":"mining","word":"Hydraulic motor","ipa":"/haɪˈdrɔːlɪk ˈmoʊtər/","zh":"液压马达","example":"A hydraulic motor drives the rotary head.","exampleZh":"液压马达驱动回转动力头。"},{"id":"mining-052","category":"mining","word":"Hydraulic cylinder","ipa":"/haɪˈdrɔːlɪk ˈsɪlɪndər/","zh":"液压缸","example":"The hydraulic cylinder extends the boom.","exampleZh":"液压缸推动动臂伸出。"},{"id":"mining-053","category":"mining","word":"Relief valve","ipa":"/rɪˈliːf vælv/","zh":"溢流阀","example":"The relief valve limits system pressure.","exampleZh":"溢流阀限制系统压力。"},{"id":"mining-054","category":"mining","word":"Directional control valve","ipa":"/dəˈrɛkʃənəl kənˈtroʊl vælv/","zh":"方向控制阀","example":"The directional control valve changes oil flow direction.","exampleZh":"方向控制阀改变油液流向。"},{"id":"mining-055","category":"mining","word":"Flow control valve","ipa":"/floʊ kənˈtroʊl vælv/","zh":"流量控制阀","example":"The flow control valve adjusts actuator speed.","exampleZh":"流量控制阀调节执行机构速度。"},{"id":"mining-056","category":"mining","word":"Pilot pressure","ipa":"/ˈpaɪlət ˈprɛʃər/","zh":"先导压力","example":"Low pilot pressure may prevent valve operation.","exampleZh":"先导压力过低可能使阀无法动作。"},{"id":"mining-057","category":"mining","word":"Hydraulic oil","ipa":"/haɪˈdrɔːlɪk ɔɪl/","zh":"液压油","example":"Check the hydraulic oil level daily.","exampleZh":"每天检查液压油液位。"},{"id":"mining-058","category":"mining","word":"Oil temperature","ipa":"/ɔɪl ˈtɛmprətʃər/","zh":"油温","example":"High oil temperature can reduce system performance.","exampleZh":"油温过高会降低系统性能。"},{"id":"mining-059","category":"mining","word":"Return filter","ipa":"/rɪˈtɜːrn ˈfɪltər/","zh":"回油滤芯","example":"Replace the return filter according to the service plan.","exampleZh":"按保养计划更换回油滤芯。"},{"id":"mining-060","category":"mining","word":"Cooling fan","ipa":"/ˈkuːlɪŋ fæn/","zh":"散热风扇","example":"The cooling fan starts when the oil gets hot.","exampleZh":"液压油升温后散热风扇启动。"},{"id":"mining-061","category":"mining","word":"Pressure sensor","ipa":"/ˈprɛʃər ˈsɛnsər/","zh":"压力传感器","example":"The pressure sensor sends feedback to the PLC.","exampleZh":"压力传感器向 PLC 发送反馈。"},{"id":"mining-062","category":"mining","word":"Proximity sensor","ipa":"/prɑːkˈsɪmɪti ˈsɛnsər/","zh":"接近传感器","example":"The proximity sensor detects rod position.","exampleZh":"接近传感器检测钻杆位置。"},{"id":"mining-063","category":"mining","word":"Limit switch","ipa":"/ˈlɪmɪt swɪtʃ/","zh":"限位开关","example":"The limit switch confirms the end position.","exampleZh":"限位开关确认到位状态。"},{"id":"mining-064","category":"mining","word":"Emergency stop","ipa":"/ɪˈmɜːrdʒənsi stɑːp/","zh":"急停","example":"Test the emergency stop according to procedure.","exampleZh":"按规定流程测试急停装置。"},{"id":"mining-065","category":"mining","word":"Overload protection","ipa":"/ˈoʊvərloʊd prəˈtɛkʃən/","zh":"过载保护","example":"Overload protection stops unsafe operation.","exampleZh":"过载保护防止不安全运行。"},{"id":"mining-066","category":"mining","word":"Fault recovery","ipa":"/fɔːlt rɪˈkʌvəri/","zh":"故障恢复","example":"Fault recovery requires checking the cause first.","exampleZh":"故障恢复前必须先检查原因。"},{"id":"mining-067","category":"mining","word":"Automatic drilling","ipa":"/ˌɔːtəˈmætɪk ˈdrɪlɪŋ/","zh":"自动钻进","example":"Automatic drilling adjusts parameters using feedback.","exampleZh":"自动钻进根据反馈调节参数。"},{"id":"mining-068","category":"mining","word":"Drilling sequence","ipa":"/ˈdrɪlɪŋ ˈsiːkwəns/","zh":"钻孔动作序列","example":"The drilling sequence includes several safety checks.","exampleZh":"钻孔动作序列包含多项安全检查。"},{"id":"mining-069","category":"mining","word":"Wireline winch","ipa":"/ˈwaɪərlaɪn wɪntʃ/","zh":"绳索取芯卷扬","example":"The wireline winch retrieves the inner tube.","exampleZh":"绳索取芯卷扬回收内管。"},{"id":"mining-070","category":"mining","word":"Main hoist","ipa":"/meɪn hɔɪst/","zh":"主卷扬","example":"The main hoist lifts the drill string.","exampleZh":"主卷扬提升钻柱。"},{"id":"mining-071","category":"mining","word":"Rock hardness","ipa":"/rɑːk ˈhɑːrdnəs/","zh":"岩石硬度","example":"Rock hardness affects the drilling rate.","exampleZh":"岩石硬度影响钻进速度。"},{"id":"mining-072","category":"mining","word":"Fracture zone","ipa":"/ˈfræktʃər zoʊn/","zh":"破碎带","example":"Drilling becomes less stable in the fracture zone.","exampleZh":"钻进在破碎带中变得不稳定。"},{"id":"mining-073","category":"mining","word":"Overburden","ipa":"/ˈoʊvərˌbɜːrdən/","zh":"覆盖层","example":"The borehole passes through the overburden first.","exampleZh":"钻孔首先穿过覆盖层。"},{"id":"mining-074","category":"mining","word":"Bench","ipa":"/bɛntʃ/","zh":"台阶（露天矿）","example":"The crew is working on the upper bench.","exampleZh":"施工班组正在上部台阶作业。"},{"id":"mining-075","category":"mining","word":"Haul road","ipa":"/hɔːl roʊd/","zh":"矿山运输道路","example":"Keep the haul road clear of obstacles.","exampleZh":"保持矿山运输道路畅通。"},{"id":"mining-076","category":"mining","word":"Haul truck","ipa":"/hɔːl trʌk/","zh":"矿用运输卡车","example":"The haul truck moves ore to the crusher.","exampleZh":"矿用卡车将矿石运送到破碎机。"},{"id":"mining-077","category":"mining","word":"Dust suppression","ipa":"/dʌst səˈprɛʃən/","zh":"抑尘","example":"Water spray is used for dust suppression.","exampleZh":"采用喷水进行抑尘。"},{"id":"mining-078","category":"mining","word":"Ventilation system","ipa":"/ˌvɛntɪˈleɪʃən ˈsɪstəm/","zh":"通风系统","example":"The ventilation system provides fresh air underground.","exampleZh":"通风系统向井下提供新鲜空气。"},{"id":"mining-079","category":"mining","word":"Ground support","ipa":"/ɡraʊnd səˈpɔːrt/","zh":"围岩支护","example":"Ground support is installed where required.","exampleZh":"在需要的区域安装围岩支护。"},{"id":"mining-080","category":"mining","word":"Rock bolt","ipa":"/rɑːk boʊlt/","zh":"锚杆","example":"A rock bolt helps stabilize the rock mass.","exampleZh":"锚杆有助于稳定岩体。"}];</script>
<script>
(()=>{'use strict';
const BASE_WORDS=INITIAL_WORDS;
const CAT={daily:{label:'日常沟通',emoji:'💬'},ev:{label:'新能源汽车',emoji:'⚡'},mining:{label:'矿山工程',emoji:'⛏️'}};
const KEY='wordsprout.local.v1',EPOCH='2026-10-10',LEVELS=[1,3,7,14,30,60];
const main=document.getElementById('appMain'),datePill=document.getElementById('datePill');
const $=s=>document.querySelector(s);
const blank=()=>({version:1,records:{},daily:{},extras:[],settings:{accent:'en-US',rate:.83}});
let memoryOnly=false,state=blank(),tab='today',libraryScope='learned',categoryFilter='all',librarySearch='',libraryLimit=40,reviewScope='due',toastTimer=null,lastToday='';
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function readStore(){try{const t=localStorage.getItem(KEY);if(t){const p=JSON.parse(t);if(p&&typeof p==='object'){state={...blank(),...p,records:(p.records&&typeof p.records==='object')?p.records:{},daily:(p.daily&&typeof p.daily==='object')?p.daily:{},extras:Array.isArray(p.extras)?p.extras:[],settings:{...blank().settings,...(p.settings||{})}};}}}catch(e){memoryOnly=true;}}
function saveStore(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){memoryOnly=true;}}
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(day,n){const [y,m,d]=day.split('-').map(Number);return localDate(new Date(y,m-1,d+n,12));}
function daysApart(a,b){const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);}
function today(){return localDate();}
function listWords(){return BASE_WORDS.concat(state.extras);}
function buildDeck(){const groups={daily:[],ev:[],mining:[]};BASE_WORDS.forEach(w=>groups[w.category].push(w));const deck=[];for(let i=0;i<Math.max(...Object.values(groups).map(a=>a.length));i++){for(const c of ['daily','ev','mining'])if(groups[c][i])deck.push(groups[c][i]);}return deck.concat(state.extras);}
function dailyItems(day=today()){const deck=buildDeck(),cycle=Math.floor((Math.max(0,daysApart(EPOCH,day)))/Math.ceil(deck.length/5));const d=((daysApart(EPOCH,day)%Math.ceil(deck.length/5))+Math.ceil(deck.length/5))%Math.ceil(deck.length/5);const start=d*5;return {items:Array.from({length:5},(_,i)=>deck[(start+i)%deck.length]),dayNumber:d+1,daysTotal:Math.ceil(deck.length/5),cycle};}
function getRecord(id){return state.records[id]||{};}
function completion(day=today()){const words=dailyItems(day).items;return words.filter(w=>state.daily[day]?.[w.id]).length;}
function getStreak(){let d=today();if(completion(d)<5)d=addDays(d,-1);let s=0;for(let i=0;i<400;i++){if(completion(d)===5){s++;d=addDays(d,-1);}else break;}return s;}
function getLearned(){return listWords().filter(w=>!!getRecord(w.id).seen);}
function getDue(){return getLearned().filter(w=>getRecord(w.id).due && getRecord(w.id).due<=today()).sort((a,b)=>(getRecord(a.id).due||'').localeCompare(getRecord(b.id).due||''));}
function uiDate(day){const [y,m,d]=day.split('-').map(Number);return `${m}月${d}日`;}
function stats(){return {learned:getLearned().length,due:getDue().length,streak:getStreak()};}
function buttonAction(action,w,text,cls=''){return `<button class="btn ${cls}" data-action="${action}" data-id="${escapeHtml(w.id)}">${text}</button>`;}
function topActions(w){const r=getRecord(w.id);return `<div class="card-top"><span class="category">${CAT[w.category]?.emoji||'📚'} ${CAT[w.category]?.label||'自定义'}</span><button class="favorite ${r.favorite?'active':''}" data-action="favorite" data-id="${escapeHtml(w.id)}" aria-label="${r.favorite?'取消收藏':'收藏'}" title="收藏">${r.favorite?'💛':'🤍'}</button></div>`;}
function fullCard(w,index,mode='today'){
const r=getRecord(w.id),picked=state.daily[today()]?.[w.id];
const status=mode==='today'&&picked?`<span class="status-tag ${picked==='hard'?'hard':''}">${picked==='hard'?'🔁 已安排复习':'✅ 今日已完成'}</span>`:mode==='review'?`<span class="status-tag hard">📆 到期 ${escapeHtml(uiDate(r.due||today()))}</span>`:'';
return `<article class="panel word-card ${escapeHtml(w.category)}" id="card-${escapeHtml(w.id)}">${topActions(w)}
<div style="display:flex;align-items:center;gap:10px;margin-top:9px"><span class="card-num">CARD ${String(index+1).padStart(2,'0')}</span>${status}</div>
<h3 class="word-text">${escapeHtml(w.word)}</h3><div class="ipa">${escapeHtml(w.ipa)}</div>
<div class="cn">${escapeHtml(w.zh)}</div>
<div class="actions" style="margin-top:8px">${buttonAction('speak',w,'🔊 听单词','sound')}${buttonAction('speak-example',w,'🎧 听例句','sound2')}</div>
<div class="divider-dashed"></div><div class="example-label"><span>✏️ EXAMPLE SENTENCE</span><span>🌟</span></div>
<div class="example-en">${escapeHtml(w.example)}</div><div class="example-zh">${escapeHtml(w.exampleZh)}</div>
<div class="divider-dashed"></div><div class="actions">
${buttonAction('hard',w,'🔄 再练练','hard')}
${buttonAction('easy',w,'✨ 掌握啦','easy')}
</div></article>`;}
function miniCard(w){
const r=getRecord(w.id),due=r.due?`下次复习：${uiDate(r.due)}`:'尚未学习';
return `<article class="mini-card"><div class="mini-head"><div><div class="mini-word">${escapeHtml(w.word)}</div><div class="mini-meta">${escapeHtml(w.ipa)} · ${CAT[w.category]?.label||'自定义'}</div><div class="mini-zh">${escapeHtml(w.zh)}</div></div>
<button class="favorite ${r.favorite?'active':''}" data-action="favorite" data-id="${escapeHtml(w.id)}" aria-label="${r.favorite?'取消收藏':'收藏'}">${r.favorite?'💛':'🤍'}</button></div>
<div class="mini-example">${escapeHtml(w.example)}<div style="color:#919aaa">${escapeHtml(w.exampleZh)}</div></div>
<div class="mini-meta">${escapeHtml(due)}</div>
<div class="mini-actions">${buttonAction('speak',w,'🔊 单词','sound')}${buttonAction('speak-example',w,'🎧 例句','sound2')}${buttonAction('practice',w,'🧠 加入复习','outline')}</div></article>`;}
function todayPage(){
const t=today(),pack=dailyItems(),count=completion(),s=stats(),progress=count*20;
const heading=pack.cycle>0?'新的一轮，复习更牢固':'每天5个，轻松积累';
const cycleNote=pack.cycle>0?`你已进入第 ${pack.cycle+1} 轮词库学习，本轮会再次出现以前学过的词。可以从设置中导入新词扩充词库。`:`第 ${pack.dayNumber} / ${pack.daysTotal} 天 · 三个领域交替学习`;
return `<section class="panel hero"><div class="hero-top"><div><span class="eyebrow">☀️ TODAY'S LITTLE WIN</span><h1>${heading}<br/>英语长出新芽 🌱</h1><p>${escapeHtml(cycleNote)}</p></div><span class="hero-art" aria-hidden="true">📖🐣</span></div>
<div class="progress-head"><span>🍀 今日打卡进度</span><span>${count} / 5 已完成</span></div><div class="progress-track" role="progressbar" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="5"><div class="progress-fill" style="width:${progress}%"></div></div></section>
<div class="stats"><div class="stat"><b>${s.streak} 🔥</b><small>连续学习天数</small></div><div class="stat"><b>${s.learned} 📚</b><small>已接触词组</small></div><div class="stat"><b>${s.due} 🧠</b><small>待复习词组</small></div></div>
<div class="section-heading"><h2>🪄 今天的 5 张卡片</h2><small>${escapeHtml(uiDate(t))}</small></div>
${pack.items.map((w,i)=>fullCard(w,i)).join('')}
${count===5?'<div class="empty" style="margin-top:18px;background:#ddf6e7"><div class="empty-art">🏆🌸</div><h3>今天的5个词学完啦！</h3><p>明天自动切换到下一组。到「复习」看看需要巩固的内容吧。</p></div>':''}`;
}
function filterChips(selected,items,attr){return items.map(([key,label])=>`<button class="chip ${selected===key?'active':''}" data-${attr}="${escapeHtml(key)}" aria-pressed="${selected===key}">${escapeHtml(label)}</button>`).join('');}
function reviewPage(){
const s=stats(),items=reviewScope==='due'?getDue():getLearned().slice().reverse();
return `<section class="panel review-intro"><h1>🧠 记忆补给站</h1><p>按复习间隔自动提醒：掌握越牢，间隔越长。点「再练练」会重新安排明天复习。</p></section>
<div class="stats"><div class="stat"><b>${s.due}</b><small>今日到期</small></div><div class="stat"><b>${s.learned}</b><small>学习记录</small></div><div class="stat"><b>${s.streak} 🔥</b><small>连续打卡</small></div></div>
<div class="filterbar">${filterChips(reviewScope,[['due','⏰ 今日待复习'],['all','📖 全部已学']],'review-filter')}</div>
<div class="section-heading"><h2>${reviewScope==='due'?'今天要巩固的词':'已学词语回顾'}</h2><small>${items.length} 个</small></div>
${items.length?items.map((w,i)=>fullCard(w,i,'review')).join(''):`<div class="empty"><div class="empty-art">🎉</div><h3>${reviewScope==='due'?'没有到期的复习任务':'暂时没有学习记录'}</h3><p>${reviewScope==='due'?'做得好！今天的新词会按照复习间隔进入这里。':'先去「今日」学习5个词吧。'}</p></div>`}`;
}
function libraryPage(){
const learned=new Set(getLearned().map(w=>w.id)),all=listWords();
const filtered=all.filter(w=>(libraryScope==='all'||(libraryScope==='learned'&&learned.has(w.id))||(libraryScope==='favorite'&&getRecord(w.id).favorite))&&(categoryFilter==='all'||w.category===categoryFilter)&&(`${w.word} ${w.zh} ${w.example} ${w.exampleZh}`.toLowerCase().includes(librarySearch.toLowerCase())));
return `<section class="panel library-head"><h1>📚 我的单词花园</h1><p>内置 ${BASE_WORDS.length} 个精选词组，已经学习 ${learned.size} 个。也可以查看所有词、收藏与搜索。</p></section>
<div class="search"><span>🔎</span><input id="wordSearch" placeholder="搜索单词、中文或例句…" autocomplete="off" value="${escapeHtml(librarySearch)}" aria-label="搜索词库"/></div>
<div class="filterbar">${filterChips(libraryScope,[['learned','🌱 已学习'],['favorite','💛 已收藏'],['all','📚 全部词库']],'library-scope')}</div>
<div class="filterbar">${filterChips(categoryFilter,[['all','全部领域'],['daily','💬 日常'],['ev','⚡ 新能源'],['mining','⛏️ 矿山']],'category-filter')}</div>
<div class="section-heading"><h2>词语列表</h2><small>匹配 ${filtered.length} 个</small></div>
${filtered.length?filtered.slice(0,libraryLimit).map(miniCard).join('')+ (filtered.length>libraryLimit?`<button class="btn primary" style="display:flex;width:100%;margin:15px 0" data-action="more">查看更多（剩余 ${filtered.length-libraryLimit} 个）</button>`:''):`<div class="empty"><div class="empty-art">🪴</div><h3>这里还没有内容</h3><p>学习新词、收藏喜欢的词，或切换到全部词库看看。</p></div>`}`;
}
function historyMarkup(){let ds=[];for(let i=6;i>=0;i--){const d=addDays(today(),-i),n=completion(d);ds.push(`<div class="history-day ${n===5?'done':n>0?'partial':''}"><b>${new Date(d+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'})}</b><small>${n}/5</small></div>`);}return `<div class="history-list">${ds.join('')}</div>`;}
function settingsPage(){
const s=stats(),pack=dailyItems();
return `<section class="panel settings-head"><h1>⚙️ 学习小设置</h1><p>朗读使用手机系统语音；学习进度保存在本机，不需注册账号。</p></section>
<section class="panel settings-block"><h3 class="subhead">🎙️ 发音设置</h3>
<div class="setting-row"><label for="accent">英语口音</label><select id="accent"><option value="en-US" ${state.settings.accent==='en-US'?'selected':''}>🇺🇸 美式英语</option><option value="en-GB" ${state.settings.accent==='en-GB'?'selected':''}>🇬🇧 英式英语</option></select></div>
<div class="setting-row"><label for="speechRate">朗读速度 <span id="rateLabel">${Number(state.settings.rate||.83).toFixed(2)}×</span></label><input id="speechRate" type="range" min=".6" max="1.1" step=".05" value="${Number(state.settings.rate||.83)}" aria-label="朗读速度"/></div>
<div class="notice">🔊 需要允许手机浏览器播放声音。系统语音是否支持离线朗读，取决于设备内已安装的英语语音包。</div></section>
<section class="panel settings-block"><h3 class="subhead">🗓️ 最近 7 天</h3>${historyMarkup()}<div class="setting-row"><span style="font-size:13px;font-weight:850">已学习 ${s.learned} / ${listWords().length} 词</span><span style="font-size:13px;font-weight:900">🔥 ${s.streak} 天</span></div></section>
<section class="panel settings-block"><h3 class="subhead">💾 备份与扩充</h3><p style="font-size:13px;line-height:1.75;color:var(--muted)">你可以导出学习记录备份到手机文件中，再导入恢复。也支持导入新词 JSON，避免内置词库学完后重复。</p>
<div class="setting-actions"><button class="btn primary" data-action="export">📤 导出学习记录</button><button class="btn outline" data-action="import">📥 导入备份 / 新词</button></div>
<div class="notice">🍎 首版内置240词，按日期连续48天不重复，第49天开始新一轮巩固。导入新增词组可延长学习周期；不会自动从互联网抓取新单词。</div></section>
<section class="panel settings-block"><h3 class="subhead">🧹 数据管理</h3><div class="setting-actions"><button class="btn outline" data-action="clear">🗑️ 清空本机学习进度</button></div><div class="notice">⚠️ 浏览器清理网站数据、切换设备或使用无痕模式可能导致记录丢失，建议定期导出备份。${memoryOnly?'当前浏览器无法保存记录，请在 Safari / Chrome 中以 HTTPS 网站方式打开。':''}</div></section>
<section class="panel settings-block"><h3 class="subhead">🌼 如何添加到手机桌面</h3><p style="font-size:13px;line-height:1.9;color:#697589">iPhone：用 Safari 打开已部署的 HTTPS 网页 → 分享 →「添加到主屏幕」。<br/>安卓：用 Chrome 打开网页 → 菜单 →「添加到主屏幕」或「安装应用」。</p></section>`;
}
function render(preserve=true){const y=preserve?window.scrollY:0;const now=today();lastToday=now;datePill.textContent=`📅 ${uiDate(now)}`;main.innerHTML=tab==='today'?todayPage():tab==='review'?reviewPage():tab==='library'?libraryPage():settingsPage();
document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));else window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function lookup(id){return listWords().find(w=>w.id===id);}
function mark(id,result){const word=lookup(id);if(!word)return;const r=getRecord(id),repeat=result==='easy'?Math.min(6,(r.repetitions||0)+1):0;const interval=result==='easy'?LEVELS[repeat-1]:1;
state.records[id]={...r,seen:true,repetitions:repeat,interval,due:addDays(today(),interval),last:today(),lastResult:result};
if(tab==='today'){if(!state.daily[today()])state.daily[today()]={};state.daily[today()][id]=result;}
saveStore();render();toast(result==='easy'?`✨ 已学会，${interval} 天后复习`:'🌼 已安排明天再练');}
function speak(t){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){toast('当前环境不支持语音，请在 Safari 或 Chrome 打开');return;}
try{const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=state.settings.accent||'en-US';u.rate=Number(state.settings.rate)||.83;u.pitch=1.02;const vs=synth.getVoices();const chosen=vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase()&&v.localService)||vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith('en'));if(chosen)u.voice=chosen;u.onerror=()=>toast('朗读失败，请检查系统英语语音包和声音设置');synth.speak(u);}catch(e){toast('朗读未启动，请尝试 Safari / Chrome');}}
function downloadJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function validExtra(w){return w&&typeof w==='object'&&['word','ipa','zh','example','exampleZh'].every(k=>typeof w[k]==='string'&&w[k].trim()&&w[k].length<501);}
async function doImport(file){if(!file||file.size>2_000_000){toast('文件不能超过2MB');return;}try{const obj=JSON.parse(await file.text());const isBackup=obj&&obj.version===1&&obj.records&&obj.daily;
if(isBackup){if(!window.confirm('导入备份会替换本机的学习记录和自定义词库，确定继续吗？'))return;
const rec=obj.records&&typeof obj.records==='object'?obj.records:{},day=obj.daily&&typeof obj.daily==='object'?obj.daily:{};
const ex=Array.isArray(obj.extras)?obj.extras.filter(validExtra).slice(0,1000):[];
state={...blank(),records:rec,daily:day,extras:ex,settings:{...blank().settings,...(obj.settings||{})}};saveStore();render(false);toast('✅ 备份已恢复');return;}
const words=Array.isArray(obj)?obj:Array.isArray(obj.words)?obj.words:null;if(!words||!words.length){toast('格式不正确：需要 words 数组或备份文件');return;}
const known=new Set(listWords().map(w=>w.word.toLowerCase())),newWords=[];
for(const row of words.slice(0,1000)){if(!validExtra(row)||known.has(row.word.toLowerCase()))continue;known.add(row.word.toLowerCase());
newWords.push({id:'custom-'+Date.now().toString(36)+'-'+newWords.length,category:['daily','ev','mining'].includes(row.category)?row.category:'daily',word:row.word.trim(),ipa:row.ipa.trim(),zh:row.zh.trim(),example:row.example.trim(),exampleZh:row.exampleZh.trim()});}
state.extras.push(...newWords);saveStore();render(false);toast(`🌱 已导入 ${newWords.length} 个新词`);}catch(e){toast('文件读取失败，请检查 JSON 格式');}}
document.addEventListener('click',ev=>{
const nav=ev.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render(false);return;}
const filter=ev.target.closest('[data-library-scope],[data-category-filter],[data-review-filter]');if(filter){if(filter.dataset.libraryScope){libraryScope=filter.dataset.libraryScope;libraryLimit=40;}if(filter.dataset.categoryFilter){categoryFilter=filter.dataset.categoryFilter;libraryLimit=40;}if(filter.dataset.reviewFilter)reviewScope=filter.dataset.reviewFilter;render();return;}
const b=ev.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,word=id?lookup(id):null;
if(action==='speak'&&word){speak(word.word);return;}if(action==='speak-example'&&word){speak(word.example);return;}
if(action==='favorite'&&word){const r=getRecord(id);state.records[id]={...r,favorite:!r.favorite};saveStore();render();toast(!r.favorite?'💛 已收藏':'🤍 已取消收藏');return;}
if(action==='easy'||action==='hard'){mark(id,action);return;}
if(action==='practice'&&word){const r=getRecord(id);state.records[id]={...r,seen:true,due:today(),repetitions:r.repetitions||0};saveStore();tab='review';reviewScope='due';render(false);toast('🧠 已加入今天的复习');return;}
if(action==='more'){libraryLimit+=40;render();return;}
if(action==='export'){downloadJson({version:1,exportedAt:new Date().toISOString(),records:state.records,daily:state.daily,extras:state.extras,settings:state.settings},`word-sprout-backup-${today()}.json`);toast('📁 备份文件已导出');return;}
if(action==='import'){$('#importFile').click();return;}
if(action==='clear'){if(window.confirm('确定清空本机学习记录吗？此操作无法撤销。请先导出备份。')){state=blank();saveStore();render(false);toast('本机学习记录已清空');}return;}
});
document.addEventListener('input',ev=>{if(ev.target.id==='wordSearch'){librarySearch=ev.target.value;libraryLimit=40;const at=ev.target.selectionStart;render();const inp=$('#wordSearch');inp.focus();inp.setSelectionRange(at,at);}if(ev.target.id==='speechRate'){state.settings.rate=Number(ev.target.value);const label=$('#rateLabel');if(label)label.textContent=Number(ev.target.value).toFixed(2)+'×';saveStore();}});
document.addEventListener('change',ev=>{if(ev.target.id==='accent'){state.settings.accent=ev.target.value;saveStore();toast('🎙️ 发音偏好已更新');}});
$('#importFile').addEventListener('change',async ev=>{await doImport(ev.target.files?.[0]);ev.target.value='';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastToday)render(false);});
window.addEventListener('focus',()=>{if(today()!==lastToday)render(false);});
readStore();render(false);
if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
})();
</script>
</body></html>
